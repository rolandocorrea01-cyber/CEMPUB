<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Navegador del Cementerio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css">
<link rel="stylesheet" href="estilo.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box} body{margin:0}</style>
</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Mapa del cementerio"></div>
  <div id="top">
    <div class="buscar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="Nombre, N° de punto o tumba" aria-label="Buscar por nombre, número de punto o tumba">
      <button id="limpiar" type="button" hidden>Limpiar</button>
    </div>
    <div id="res" hidden></div>
  </div>
  <div id="ley" aria-label="Leyenda">
    <span><i class="dot s-I"></i>Identificado</span><span><i class="dot s-D"></i>Por definir</span><span><i class="dot s-S"></i>Sin nombre</span>
  </div>
  <section id="ficha" class="oculta" aria-live="polite"><div class="asa"></div><div id="fc"></div></section>
  <div id="lb" hidden><button type="button" id="lbx">Cerrar</button><figure style="margin:0"><img id="lbi" alt=""><p id="lbt"></p></figure></div>
  <div id="aviso" role="status" hidden></div>
  <div id="carga">Cargando el cementerio…</div>
  <div id="entrar" hidden><div class="caja">
    <h1>Navegador del Cementerio</h1>
    <p>Cementerio Municipal de Santiago. Busque un difunto, un número de punto o una tumba y vea el recorrido desde la entrada.</p>
    <p>Los datos son privados: inicie sesión con su cuenta de ArcGIS Online.</p>
    <button id="btnEntrar" type="button">Iniciar sesión con ArcGIS</button>
  </div></div>
</div>


<script src="https://js.arcgis.com/4.30/"></script>
<script src="app.js"></script>
</body>
</html>
